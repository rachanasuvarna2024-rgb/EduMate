{% extends "admin/admin_home.html" %}

{% block title %}
Edit Stream - EduMate
{% endblock %}

{% block content %}

<div class="container">

<h2>Edit Stream</h2>

{% if err %}
<div class="error-message">
    {{ err }}
</div>
{% endif %}

<div class="card">

    <form method="POST"
          action="{{ url_for('admin.edit_stream', stream_id=stream['stream_id']) }}">

        <!-- ====================================== -->
        <!-- STREAM NAME -->
        <!-- ====================================== -->

        <div class="form-group">

            <label for="stream_name">
                Stream Name
            </label>

            <input
                type="text"
                id="stream_name"
                name="stream_name"
                value="{{ stream['stream_name'] }}"
                required
            >

        </div>


        <!-- ====================================== -->
        <!-- INSTITUTION CATEGORY -->
        <!-- ====================================== -->

        <div class="form-group">

            <label for="institution_category">
                Institution Category
            </label>

            <select
                id="institution_category"
                name="institution_category"
                required
            >

                <option value="">
                    Select Institution Category
                </option>

                <option value="School"
                    {% if stream['institution_category'] == 'School' %}
                    selected
                    {% endif %}>
                    School
                </option>

                <option value="Jr College"
                    {% if stream['institution_category'] == 'Jr College' %}
                    selected
                    {% endif %}>
                    Jr College
                </option>

                <option value="Degree College"
                    {% if stream['institution_category'] == 'Degree College' %}
                    selected
                    {% endif %}>
                    Degree College
                </option>

            </select>

        </div>


        <!-- ====================================== -->
        <!-- STATUS -->
        <!-- ====================================== -->

        <div class="form-group">

            <label for="status">
                Status
            </label>

            <select
                id="status"
                name="status"
                required
            >

                <option value="Active"
                    {% if stream['status'] == 'Active' %}
                    selected
                    {% endif %}>
                    Active
                </option>

                <option value="Inactive"
                    {% if stream['status'] == 'Inactive' %}
                    selected
                    {% endif %}>
                    Inactive
                </option>

            </select>

        </div>


        <!-- ====================================== -->
        <!-- BUTTONS -->
        <!-- ====================================== -->

        <div class="form-actions">

            <button
                type="submit"
                class="btn btn-primary">
                Update Stream
            </button>

            <a
                href="{{ url_for('admin.stream_master') }}"
                class="btn btn-secondary">
                Cancel
            </a>

        </div>

    </form>

</div>

</div>

{% endblock %}
