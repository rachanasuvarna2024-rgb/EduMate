{% extends "admin/admin_home.html" %}

{% block content %}

<div class="container">

    <h2>Edit Parent</h2>

    <p>Update the parent's details below.</p>


    {% if message %}

    <div class="error-message">
        {{ message }}
    </div>

    {% endif %}


    <div class="card">

        <form
            action="{{ url_for('admin.edit_parent', parent_id=parent.parent_id) }}"
            method="POST"
            id="parentForm"
            novalidate
        >

            <!-- Institution -->

            <label for="institution_id">
                Institution:
            </label>

            <select
                id="institution_id"
                name="institution_id"
                required
            >

                <option value="">
                    Select Institution
                </option>

                {% for institution in institutions %}

                <option
                    value="{{ institution.institution_id }}"
                    {% if institution.institution_id == parent.institution_id %}
                    selected
                    {% endif %}
                >
                    {{ institution.institution_name }}
                </option>

                {% endfor %}

            </select>

            <small id="institutionError" class="error"></small>


            <!-- Parent Name -->

            <label for="name">
                Parent Name:
            </label>

            <input
                type="text"
                id="name"
                name="name"
                maxlength="100"
                value="{{ parent.parent_name }}"
                required
            >

            <small id="nameError" class="error"></small>


            <!-- Email -->

            <label for="email">
                Email:
            </label>

            <input
                type="email"
                id="email"
                name="email"
                maxlength="150"
                value="{{ parent.email }}"
                required
            >

            <small id="emailError" class="error"></small>


            <!-- Password -->

            <label for="password">
                New Password:
            </label>

            <div class="password-container">

                <input
                    type="password"
                    id="password"
                    name="password"
                    minlength="8"
                    placeholder="Leave blank to keep current password"
                >

                <button
                    type="button"
                    class="password-toggle"
                    onclick="togglePassword()"
                >
                    👁
                </button>

            </div>

            <small id="passwordError" class="error"></small>


            <!-- Mobile -->

            <label for="mobile">
                Mobile Number:
            </label>

            <input
                type="text"
                id="mobile"
                name="mobile"
                maxlength="10"
                inputmode="numeric"
                value="{{ parent.phone or '' }}"
            >

            <small id="mobileError" class="error"></small>

            <small class="field-note">
                Optional. If provided, enter a valid 10-digit Indian mobile number.
            </small>


            <!-- Status -->

            <label for="status">
                Status:
            </label>

            <select
                id="status"
                name="status"
            >

                <option
                    value="Active"
                    {% if parent.status == 'Active' %}
                    selected
                    {% endif %}
                >
                    Active
                </option>

                <option
                    value="Inactive"
                    {% if parent.status == 'Inactive' %}
                    selected
                    {% endif %}
                >
                    Inactive
                </option>

            </select>


            <!-- Buttons -->

            <button type="submit">
                Update Parent
            </button>

            <a
                href="{{ url_for('admin.view_parents') }}"
                style="margin-left:10px;"
            >
                Cancel
            </a>

        </form>

    </div>

</div>


<style>

.error-message {
    color: #991b1b;
    background: #fef2f2;
    border: 1px solid #fecaca;
    padding: 10px 12px;
    border-radius: 8px;
    margin-bottom: 15px;
}

.error {
    color: #dc2626;
    display: none;
    margin-top: 3px;
    margin-bottom: 5px;
    font-size: 13px;
    background: transparent;
    border: none;
}

.field-note {
    display: block;
    color: #6b7280;
    font-size: 12px;
    margin-top: -5px;
    margin-bottom: 12px;
}

input.invalid,
input.valid,
select.invalid,
select.valid {
    border: 1px solid #ccc !important;
    background-color: white !important;
    box-shadow: none !important;
}

.password-container {
    display: flex;
    align-items: center;
}

.password-container input {
    flex: 1;
}

.password-toggle {
    margin-left: 6px;
    padding: 8px 10px;
    cursor: pointer;
}

</style>


<script>

const form =
    document.getElementById("parentForm");

const institutionInput =
    document.getElementById("institution_id");

const nameInput =
    document.getElementById("name");

const emailInput =
    document.getElementById("email");

const passwordInput =
    document.getElementById("password");

const mobileInput =
    document.getElementById("mobile");


// =====================================================
// ERROR FUNCTIONS
// =====================================================

function showError(errorElement, message) {

    errorElement.textContent = message;
    errorElement.style.display = "block";

}


function clearError(errorElement) {

    errorElement.textContent = "";
    errorElement.style.display = "none";

}


// =====================================================
// INSTITUTION
// =====================================================

function validateInstitution() {

    const error =
        document.getElementById("institutionError");

    if (institutionInput.value === "") {

        showError(
            error,
            "Please select an institution."
        );

        return false;

    }

    clearError(error);

    return true;

}


// =====================================================
// NAME
// =====================================================

function validateName() {

    const name =
        nameInput.value.trim();

    const error =
        document.getElementById("nameError");

    const namePattern =
        /^[A-Za-z][A-Za-z .']{1,99}$/;


    if (name === "") {

        showError(
            error,
            "Parent name is required."
        );

        return false;

    }


    if (!namePattern.test(name)) {

        showError(
            error,
            "Name should contain only letters, spaces, dots or apostrophes."
        );

        return false;

    }


    clearError(error);

    return true;

}


// =====================================================
// EMAIL
// =====================================================

function validateEmail() {

    const email =
        emailInput.value.trim();

    const error =
        document.getElementById("emailError");

    const emailPattern =
        /^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$/;


    if (email === "") {

        showError(
            error,
            "Email address is required."
        );

        return false;

    }


    if (!emailPattern.test(email)) {

        showError(
            error,
            "Please enter a valid email address."
        );

        return false;

    }


    clearError(error);

    return true;

}


// =====================================================
// PASSWORD
// =====================================================

function validatePassword() {

    const password =
        passwordInput.value;

    const error =
        document.getElementById("passwordError");


    // Blank means keep existing password

    if (password === "") {

        clearError(error);

        return true;

    }


    if (password.length < 8) {

        showError(
            error,
            "New password must contain at least 8 characters."
        );

        return false;

    }


    clearError(error);

    return true;

}


// =====================================================
// MOBILE
// =====================================================

function validateMobile() {

    const mobile =
        mobileInput.value.trim();

    const error =
        document.getElementById("mobileError");

    const mobilePattern =
        /^[6-9][0-9]{9}$/;


    if (mobile === "") {

        clearError(error);

        return true;

    }


    if (!mobilePattern.test(mobile)) {

        showError(
            error,
            "Enter a valid 10-digit Indian mobile number."
        );

        return false;

    }


    clearError(error);

    return true;

}


// =====================================================
// LIVE VALIDATION
// =====================================================

institutionInput.addEventListener(
    "change",
    validateInstitution
);

nameInput.addEventListener(
    "input",
    validateName
);

emailInput.addEventListener(
    "input",
    validateEmail
);

passwordInput.addEventListener(
    "input",
    validatePassword
);

mobileInput.addEventListener(
    "input",
    function () {

        this.value =
            this.value.replace(/[^0-9]/g, "");

        validateMobile();

    }
);


// =====================================================
// SUBMIT
// =====================================================

form.addEventListener(
    "submit",
    function (event) {

        const institutionValid =
            validateInstitution();

        const nameValid =
            validateName();

        const emailValid =
            validateEmail();

        const passwordValid =
            validatePassword();

        const mobileValid =
            validateMobile();


        if (
            !institutionValid ||
            !nameValid ||
            !emailValid ||
            !passwordValid ||
            !mobileValid
        ) {

            event.preventDefault();

            return false;

        }

    }
);


// =====================================================
// PASSWORD SHOW / HIDE
// =====================================================

function togglePassword() {

    const password =
        document.getElementById("password");

    if (password.type === "password") {

        password.type = "text";

    } else {

        password.type = "password";

    }

}

</script>

{% endblock %}
