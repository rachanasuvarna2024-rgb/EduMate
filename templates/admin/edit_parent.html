{% extends "admin/admin_home.html" %}

{% block content %}

<div class="container">

<h2>Edit Parent</h2>

<p>Update the parent's details below.</p>

{% if message %}
    <div class="error">
        {{ message }}
    </div>
{% endif %}

<div class="card">

    <form action="{{ url_for('admin.edit_parent', parent_id=parent.parent_id) }}"
          method="POST"
          id="editParentForm"
          novalidate>

        <!-- Parent Name -->
        <label for="name">Parent Name:</label>

        <input type="text"
               id="name"
               name="name"
               value="{{ parent.name }}"
               maxlength="50"
               required>

        <small id="nameError" class="error"></small>


        <!-- Email -->
        <label for="email">Email:</label>

        <input type="email"
               id="email"
               name="email"
               value="{{ parent.email }}"
               maxlength="100"
               required>

        <small id="emailError" class="error"></small>


        <!-- Mobile -->
        <label for="mobile">Mobile Number:</label>

        <input type="text"
               id="mobile"
               name="mobile"
               value="{{ parent.mobile or '' }}"
               maxlength="10"
               inputmode="numeric"
               required>

        <small id="mobileError" class="error"></small>


        <button type="submit">
            Save Changes
        </button>


        <a href="{{ url_for('admin.view_parents') }}"
           class="btn">
            Cancel
        </a>

    </form>

</div>

</div>

<style>

.error {
    color: red;
    display: none;
    margin-top: 3px;
    margin-bottom: 5px;
    font-size: 14px;
    background: transparent;
    border: none;
}

/* Keep input boxes normal */
input.invalid,
input.valid {
    border: 1px solid #ccc !important;
    background-color: white !important;
    box-shadow: none !important;
}

</style>

<script>

const form = document.getElementById("editParentForm");

const nameInput = document.getElementById("name");
const emailInput = document.getElementById("email");
const mobileInput = document.getElementById("mobile");


// =====================================================
// ERROR MESSAGE FUNCTIONS
// =====================================================

function showError(errorElement, message) {

    errorElement.textContent = message;
    errorElement.style.display = "block";

}


function clearError(errorElement) {

    errorElement.textContent = "";
    errorElement.style.display = "none";

}


// =====================================================
// NAME VALIDATION
// =====================================================

function validateName() {

    const name = nameInput.value.trim();
    const error = document.getElementById("nameError");

    const namePattern = /^[A-Za-z][A-Za-z .']{1,49}$/;

    if (name === "") {

        showError(error, "Parent name is required.");
        return false;

    }

    if (!namePattern.test(name)) {

        showError(
            error,
            "Name should contain only letters, spaces, dots or apostrophes."
        );

        return false;
    }

    clearError(error);

    return true;
}


// =====================================================
// EMAIL VALIDATION
// =====================================================

function validateEmail() {

    const email = emailInput.value.trim();
    const error = document.getElementById("emailError");

    const emailPattern =
        /^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$/;

    if (email === "") {

        showError(error, "Email address is required.");
        return false;

    }

    if (!emailPattern.test(email)) {

        showError(
            error,
            "Please enter a valid email address."
        );

        return false;
    }

    clearError(error);

    return true;
}


// =====================================================
// MOBILE VALIDATION
// =====================================================

function validateMobile() {

    const mobile = mobileInput.value.trim();
    const error = document.getElementById("mobileError");

    const mobilePattern = /^[6-9][0-9]{9}$/;

    if (mobile === "") {

        showError(error, "Mobile number is required.");
        return false;

    }

    if (!mobilePattern.test(mobile)) {

        showError(
            error,
            "Enter a valid 10-digit Indian mobile number."
        );

        return false;
    }

    clearError(error);

    return true;
}


// =====================================================
// VALIDATE WHILE TYPING
// =====================================================

nameInput.addEventListener("input", validateName);

emailInput.addEventListener("input", validateEmail);

mobileInput.addEventListener("input", validateMobile);


// =====================================================
// MOBILE - ALLOW ONLY NUMBERS
// =====================================================

mobileInput.addEventListener("input", function() {

    this.value = this.value.replace(/[^0-9]/g, "");

});


// =====================================================
// FORM SUBMISSION
// =====================================================

form.addEventListener("submit", function(event) {

    const nameValid = validateName();

    const emailValid = validateEmail();

    const mobileValid = validateMobile();


    if (
        !nameValid ||
        !emailValid ||
        !mobileValid
    ) {

        event.preventDefault();

        alert("Please correct the invalid fields before submitting.");

        return false;

    }

});

</script>

{% endblock %}
