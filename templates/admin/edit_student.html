{% extends "admin/admin_home.html" %}

{% block content %}

<div class="container">

    <h2>Edit Student</h2>

    <p>Update the student's details below.</p>

    {% if message %}
    <div class="error-message">
        {{ message }}
    </div>
    {% endif %}

    <div class="card">

        <form
            action="{{ url_for('admin.edit_student', student_id=student.student_id) }}"
            method="POST"
            id="studentForm"
            novalidate
        >

            <!-- Institution -->
            <label for="institution_id">
                Institution:
            </label>

            <select
                id="institution_id"
                name="institution_id"
                required
                onchange="changeInstitution(this.value)"
            >
                <option value="">
                    Select Institution
                </option>

                {% set selected_inst = request.form.get(
                    'institution_id',
                    selected_institution_id|string
                ) %}

                {% for institution in institutions %}
                <option
                    value="{{ institution.institution_id }}"
                    {% if institution.institution_id|string == selected_inst|string %}
                    selected
                    {% endif %}
                >
                    {{ institution.institution_name }}
                </option>
                {% endfor %}
            </select>

            <small id="institutionError" class="error"></small>


            <!-- Parent -->
            <label for="parent_id">
                Parent:
            </label>

            <select
                id="parent_id"
                name="parent_id"
            >
                <option value="">
                    No Parent Linked
                </option>

                {% set selected_parent = request.form.get(
                    'parent_id',
                    student.parent_id or ''
                ) %}

                {% for parent in parents %}
                <option
                    value="{{ parent.parent_id }}"
                    {% if parent.parent_id|string == selected_parent|string %}
                    selected
                    {% endif %}
                >
                    {{ parent.parent_name }}
                </option>
                {% endfor %}
            </select>


            <!-- Standard -->
            <label for="standard_id">
                Standard:
            </label>

            <select
                id="standard_id"
                name="standard_id"
            >
                <option value="">
                    No Standard Assigned
                </option>

                {% set selected_standard = request.form.get(
                    'standard_id',
                    student.standard_id or ''
                ) %}

                {% for standard in standards %}
                <option
                    value="{{ standard.standard_id }}"
                    {% if standard.standard_id|string == selected_standard|string %}
                    selected
                    {% endif %}
                >
                    {{ standard.standard_name }}
                </option>
                {% endfor %}
            </select>


            <!-- Student Name -->
            <label for="student_name">
                Student Name:
            </label>

            <input
                type="text"
                id="student_name"
                name="student_name"
                maxlength="100"
                value="{{ request.form.get('student_name', student.student_name) }}"
                required
            >

            <small id="studentNameError" class="error"></small>


            <!-- Email -->
            <label for="email">
                Email:
            </label>

            <input
                type="email"
                id="email"
                name="email"
                maxlength="150"
                value="{{ request.form.get('email', student.email) }}"
                required
            >

            <small id="emailError" class="error"></small>


            <!-- New Password -->
            <label for="password">
                New Password:
            </label>

            <div class="password-container">

                <input
                    type="password"
                    id="password"
                    name="password"
                    minlength="8"
                    placeholder="Leave blank to keep current password"
                >

                <button
                    type="button"
                    class="password-toggle"
                    onclick="togglePassword()"
                >
                    👁
                </button>

            </div>

            <small id="passwordError" class="error"></small>


            <!-- Phone -->
            <label for="phone">
                Phone Number:
            </label>

            <input
                type="text"
                id="phone"
                name="phone"
                maxlength="10"
                inputmode="numeric"
                value="{{ request.form.get('phone', student.phone or '') }}"
            >

            <small id="phoneError" class="error"></small>


            <!-- Status -->
            <label for="status">
                Status:
            </label>

            {% set selected_status = request.form.get(
                'status',
                student.status
            ) %}

            <select
                id="status"
                name="status"
            >
                <option
                    value="Active"
                    {% if selected_status == 'Active' %}
                    selected
                    {% endif %}
                >
                    Active
                </option>

                <option
                    value="Inactive"
                    {% if selected_status == 'Inactive' %}
                    selected
                    {% endif %}
                >
                    Inactive
                </option>
            </select>


            <!-- BUTTONS -->

            <button type="submit">
                Update Student
            </button>

            <a
                href="{{ url_for('admin.view_students') }}"
                style="margin-left:10px;"
            >
                Cancel
            </a>

        </form>

    </div>

</div>


<style>

.error-message {
    color: #991b1b;
    background: #fef2f2;
    border: 1px solid #fecaca;
    padding: 10px 12px;
    border-radius: 8px;
    margin-bottom: 15px;
}

.error {
    color: #dc2626;
    display: none;
    margin-top: 3px;
    margin-bottom: 5px;
    font-size: 13px;
    background: transparent;
    border: none;
}

input.invalid,
input.valid,
select.invalid,
select.valid {
    border: 1px solid #ccc !important;
    background-color: white !important;
    box-shadow: none !important;
}

.password-container {
    display: flex;
    align-items: center;
}

.password-container input {
    flex: 1;
}

.password-toggle {
    margin-left: 6px;
    padding: 8px 10px;
    cursor: pointer;
}

</style>


<script>

const form =
    document.getElementById("studentForm");

const institutionInput =
    document.getElementById("institution_id");

const studentNameInput =
    document.getElementById("student_name");

const emailInput =
    document.getElementById("email");

const passwordInput =
    document.getElementById("password");

const phoneInput =
    document.getElementById("phone");


// =====================================================
// ERROR FUNCTIONS
// =====================================================

function showError(errorElement, message) {

    errorElement.textContent = message;
    errorElement.style.display = "block";

}


function clearError(errorElement) {

    errorElement.textContent = "";
    errorElement.style.display = "none";

}


// =====================================================
// INSTITUTION
// =====================================================

function validateInstitution() {

    const error =
        document.getElementById("institutionError");

    if (institutionInput.value === "") {

        showError(
            error,
            "Please select an institution."
        );

        return false;
    }

    clearError(error);

    return true;

}


// =====================================================
// STUDENT NAME
// =====================================================

function validateStudentName() {

    const studentName =
        studentNameInput.value.trim();

    const error =
        document.getElementById("studentNameError");

    const pattern =
        /^[A-Za-z][A-Za-z .']{1,99}$/;


    if (studentName === "") {

        showError(
            error,
            "Student name is required."
        );

        return false;
    }


    if (!pattern.test(studentName)) {

        showError(
            error,
            "Name should contain only letters, spaces, dots or apostrophes."
        );

        return false;
    }


    clearError(error);

    return true;

}


// =====================================================
// EMAIL
// =====================================================

function validateEmail() {

    const email =
        emailInput.value.trim();

    const error =
        document.getElementById("emailError");

    const pattern =
        /^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$/;


    if (email === "") {

        showError(
            error,
            "Email address is required."
        );

        return false;
    }


    if (!pattern.test(email)) {

        showError(
            error,
            "Please enter a valid email address."
        );

        return false;
    }


    clearError(error);

    return true;

}


// =====================================================
// PASSWORD
// =====================================================

function validatePassword() {

    const password =
        passwordInput.value;

    const error =
        document.getElementById("passwordError");


    // Blank = keep existing password

    if (password === "") {

        clearError(error);

        return true;
    }


    if (password.length < 8) {

        showError(
            error,
            "New password must contain at least 8 characters."
        );

        return false;
    }


    clearError(error);

    return true;

}


// =====================================================
// PHONE
// =====================================================

function validatePhone() {

    const phone =
        phoneInput.value.trim();

    const error =
        document.getElementById("phoneError");

    const pattern =
        /^[6-9][0-9]{9}$/;


    // Optional field

    if (phone === "") {

        clearError(error);

        return true;
    }


    if (!pattern.test(phone)) {

        showError(
            error,
            "Enter a valid 10-digit Indian phone number."
        );

        return false;
    }


    clearError(error);

    return true;

}


// =====================================================
// LIVE VALIDATION
// =====================================================

institutionInput.addEventListener(
    "change",
    validateInstitution
);


studentNameInput.addEventListener(
    "input",
    validateStudentName
);


emailInput.addEventListener(
    "input",
    validateEmail
);


passwordInput.addEventListener(
    "input",
    validatePassword
);


phoneInput.addEventListener(
    "input",
    function () {

        this.value =
            this.value.replace(/[^0-9]/g, "");

        validatePhone();

    }
);


// =====================================================
// SUBMIT
// =====================================================

form.addEventListener(
    "submit",
    function (event) {

        const valid =
            validateInstitution() &&
            validateStudentName() &&
            validateEmail() &&
            validatePassword() &&
            validatePhone();


        if (!valid) {

            event.preventDefault();

            return false;

        }

    }
);


// =====================================================
// PASSWORD TOGGLE
// =====================================================

function togglePassword() {

    const password =
        document.getElementById("password");


    if (password.type === "password") {

        password.type = "text";

    } else {

        password.type = "password";

    }

}


// =====================================================
// CHANGE INSTITUTION
// =====================================================

function changeInstitution(value) {

    if (!value) {

        window.location.href =
            "{{ url_for('admin.edit_student', student_id=student.student_id) }}";

        return;

    }


    window.location.href =
        "{{ url_for('admin.edit_student', student_id=student.student_id) }}"
        + "?institution_id="
        + encodeURIComponent(value);

}

</script>

{% endblock %}
