{% extends "admin/admin_home.html" %}

{% block content %}

<div class="container">

    <h2>Edit Subject</h2>


    {% if err %}

    <div class="error-message">
        {{ err }}
    </div>

    {% endif %}


    <!-- ===================================================== -->
    <!-- EDIT SUBJECT -->
    <!-- ===================================================== -->

    <div class="card">

        <h3>Update Subject</h3>


        <form method="POST"
              action="{{ url_for(
                  'admin.edit_subject',
                  subject_master_id=subject.subject_master_id
              ) }}">


            <!-- ================================================= -->
            <!-- SUBJECT NAME -->
            <!-- ================================================= -->

            <div class="form-group">

                <label for="subject_name">
                    Subject Name
                </label>

                <input
                    type="text"
                    id="subject_name"
                    name="subject_name"
                    value="{{ subject.subject_name }}"
                    required
                >

            </div>


            <!-- ================================================= -->
            <!-- COURSE -->
            <!-- ================================================= -->

            <div class="form-group">

                <label for="course_id">
                    Course
                </label>

                <select
                    id="course_id"
                    name="course_id"
                    required
                    onchange="updateCourseDetails()"
                >

                    <option value="">
                        -- Select Course --
                    </option>


                    {% for course in courses %}

                    <option
                        value="{{ course.course_id }}"
                        data-category="{{ course.institution_category }}"
                        data-academic-year="{{ course.academic_year }}"

                        {% if course.course_id == subject.course_id %}
                        selected
                        {% endif %}
                    >

                        {{ course.course_name }}

                    </option>

                    {% endfor %}

                </select>

            </div>


            <!-- ================================================= -->
            <!-- ACADEMIC YEAR -->
            <!-- ================================================= -->

            <div class="form-group">

                <label for="academic_year">
                    Academic Year
                </label>

                <input
                    type="text"
                    id="academic_year"
                    value="{{ subject.academic_year }}"
                    readonly
                >

            </div>


            <!-- ================================================= -->
            <!-- INSTITUTION CATEGORY -->
            <!-- ================================================= -->

            <div class="form-group">

                <label for="institution_category">
                    Institution Category
                </label>

                <input
                    type="text"
                    id="institution_category"
                    value="{{ subject.institution_category }}"
                    readonly
                >

            </div>


            <!-- ================================================= -->
            <!-- STATUS -->
            <!-- ================================================= -->

            <div class="form-group">

                <label for="status">
                    Status
                </label>

                <select
                    id="status"
                    name="status"
                    required
                >

                    <option
                        value="Active"

                        {% if subject.status == 'Active' %}
                        selected
                        {% endif %}
                    >
                        Active
                    </option>


                    <option
                        value="Inactive"

                        {% if subject.status == 'Inactive' %}
                        selected
                        {% endif %}
                    >
                        Inactive
                    </option>

                </select>

            </div>


            <!-- ================================================= -->
            <!-- BUTTONS -->
            <!-- ================================================= -->

            <div class="action-buttons">

                <button
                    type="submit"
                    class="btn"
                >
                    Update Subject
                </button>


                <a
                    href="{{ url_for('admin.subject_master') }}"
                    class="btn"
                >
                    Cancel
                </a>

            </div>

        </form>

    </div>

</div>


<!-- ========================================================= -->
<!-- JAVASCRIPT -->
<!-- ========================================================= -->

<script>

function updateCourseDetails() {

    const courseSelect =
        document.getElementById("course_id");

    const academicYear =
        document.getElementById("academic_year");

    const institutionCategory =
        document.getElementById("institution_category");


    const selectedOption =
        courseSelect.options[
            courseSelect.selectedIndex
        ];


    if (
        !selectedOption ||
        !selectedOption.value
    ) {

        academicYear.value = "";

        institutionCategory.value = "";

        return;
    }


    academicYear.value =
        selectedOption.dataset.academicYear || "";


    institutionCategory.value =
        selectedOption.dataset.category || "";

}


/* Load details for the currently selected course */

document.addEventListener(
    "DOMContentLoaded",
    function () {

        updateCourseDetails();

    }
);

</script>


<!-- ========================================================= -->
<!-- BUTTON STYLING -->
<!-- ========================================================= -->

<style>

.action-buttons {

    display: flex;

    align-items: center;

    gap: 10px;

}


input[readonly] {

    background-color: #f5f5f5;

    cursor: not-allowed;

}

</style>

{% endblock %}
