{% extends "admin/admin_home.html" %}

{% block content %}

<div class="container">

    <h2>Edit Designation</h2>

    {% if err %}
    <div class="error-message">
        {{ err }}
    </div>
    {% endif %}


    <!-- ===================================================== -->
    <!-- EDIT DESIGNATION -->
    <!-- ===================================================== -->

    <div class="card">

        <h3>Edit Designation Details</h3>

        <form
            action="{{ url_for(
                'admin.edit_designation',
                designation_id=designation.designation_id
            ) }}"
            method="POST"
            onsubmit="return validateDesignationForm()"
        >

            <!-- DESIGNATION NAME -->

            <div class="form-group">

                <label for="designation_name">

                    Designation Name

                    <span class="required">*</span>

                </label>

                <input
                    type="text"
                    id="designation_name"
                    name="designation_name"
                    class="form-control"
                    value="{{ designation.designation_name }}"
                    placeholder="Enter designation name"
                    maxlength="150"
                    required
                >

                <small
                    class="field-error"
                    id="designation_name_error"
                ></small>

            </div>


            <!-- INSTITUTION CATEGORY -->

            <div class="form-group">

                <label for="institution_category">

                    Institution Category

                    <span class="required">*</span>

                </label>

                <select
                    id="institution_category"
                    name="institution_category"
                    class="form-control"
                    required
                >

                    <option value="">
                        -- Select Category --
                    </option>

                    <option
                        value="School"
                        {% if designation.institution_category == "School" %}
                        selected
                        {% endif %}
                    >
                        School
                    </option>

                    <option
                        value="Jr College"
                        {% if designation.institution_category == "Jr College" %}
                        selected
                        {% endif %}
                    >
                        Jr College
                    </option>

                    <option
                        value="Degree College"
                        {% if designation.institution_category == "Degree College" %}
                        selected
                        {% endif %}
                    >
                        Degree College
                    </option>

                </select>

                <small
                    class="field-error"
                    id="institution_category_error"
                ></small>

            </div>


            <!-- STATUS -->

            <div class="form-group">

                <label for="status">

                    Status

                    <span class="required">*</span>

                </label>

                <select
                    id="status"
                    name="status"
                    class="form-control"
                    required
                >

                    <option
                        value="Active"
                        {% if designation.status == "Active" %}
                        selected
                        {% endif %}
                    >
                        Active
                    </option>

                    <option
                        value="Inactive"
                        {% if designation.status == "Inactive" %}
                        selected
                        {% endif %}
                    >
                        Inactive
                    </option>

                </select>

                <small
                    class="field-error"
                    id="status_error"
                ></small>

            </div>


            <!-- BUTTONS -->

            <div class="button-group">

                <button
                    type="submit"
                    class="btn-submit"
                >
                    Update Designation
                </button>

                <a
                    href="{{ url_for('admin.designation_master') }}"
                    class="btn-cancel"
                >
                    Cancel
                </a>

            </div>

        </form>

    </div>

</div>


<style>

.container {

    max-width: 900px;

    margin: auto;

}


.card {

    background: white;

    padding: 25px;

    border-radius: 6px;

    box-shadow: 0 2px 8px rgba(0,0,0,0.08);

}


.form-group {

    margin-bottom: 15px;

}


.form-group label {

    display: block;

    margin-bottom: 6px;

    font-weight: 600;

}


.form-control {

    width: 100%;

    padding: 9px 10px;

    box-sizing: border-box;

    border: 1px solid #ccc;

    border-radius: 4px;

    font-size: 14px;

    background: white;

}


.required {

    color: #dc3545;

}


.field-error {

    display: block;

    color: #dc3545;

    font-size: 13px;

    margin-top: 4px;

    min-height: 16px;

}


.button-group {

    margin-top: 20px;

    display: flex;

    gap: 10px;

}


.btn-submit {

    background-color: #0d6efd;

    color: white;

    border: none;

    padding: 10px 24px;

    border-radius: 4px;

    cursor: pointer;

    font-size: 15px;

}


.btn-cancel {

    display: inline-block;

    background-color: #6c757d;

    color: white;

    padding: 10px 24px;

    border-radius: 4px;

    text-decoration: none;

    font-size: 15px;

}


.error-message {

    color: #721c24;

    background: #f8d7da;

    border: 1px solid #f5c6cb;

    padding: 10px 12px;

    margin-bottom: 15px;

    border-radius: 4px;

}

</style>


<script>

function validateDesignationForm() {

    let valid = true;


    document.getElementById(
        "designation_name_error"
    ).textContent = "";

    document.getElementById(
        "institution_category_error"
    ).textContent = "";

    document.getElementById(
        "status_error"
    ).textContent = "";


    const designationName =
        document.getElementById(
            "designation_name"
        ).value.trim();

    const category =
        document.getElementById(
            "institution_category"
        ).value;

    const status =
        document.getElementById(
            "status"
        ).value;


    if (designationName === "") {

        document.getElementById(
            "designation_name_error"
        ).textContent =
            "Designation name is required.";

        valid = false;

    }

    else if (designationName.length < 2) {

        document.getElementById(
            "designation_name_error"
        ).textContent =
            "Designation name must contain at least 2 characters.";

        valid = false;

    }


    if (category === "") {

        document.getElementById(
            "institution_category_error"
        ).textContent =
            "Please select an institution category.";

        valid = false;

    }


    if (status === "") {

        document.getElementById(
            "status_error"
        ).textContent =
            "Please select a status.";

        valid = false;

    }


    return valid;

}

</script>

{% endblock %}
