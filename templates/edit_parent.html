{% extends "admin_home.html" %}

{% block content %}

<div class="container">

    <h2>Edit Parent</h2>

    <p>Update the parent's details below.</p>


    {% if message %}

        <div class="error">
            {{ message }}
        </div>

    {% endif %}


    <div class="card">

        <form action="{{ url_for('admin.edit_parent', parent_id=parent.parent_id) }}"
              method="POST">


            <label for="name">Parent Name:</label>

            <input type="text"
                   id="name"
                   name="name"
                   value="{{ parent.name }}"
                   required>


            <label for="email">Email:</label>

            <input type="email"
                   id="email"
                   name="email"
                   value="{{ parent.email }}"
                   required>


            <label for="mobile">Mobile Number:</label>

            <input type="text"
                   id="mobile"
                   name="mobile"
                   value="{{ parent.mobile or '' }}"
                   maxlength="15">


            <button type="submit">
                Save Changes
            </button>


            <a href="{{ url_for('admin.view_parents') }}"
               class="btn">
                Cancel
            </a>

        </form>

    </div>

</div>

{% endblock %}
