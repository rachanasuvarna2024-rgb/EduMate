<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}EduMate{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    {% block extra_css %}{% endblock %}
</head>
<body>

<header>
    <h1>EduMate</h1>
    <h3>{% block portal_title %}Smart Student Assessment System{% endblock %}</h3>
</header>

<div class="dashboard">
    <div class="sidebar">
        {% block sidebar %}
        <!-- Role specific sidebar links go here -->
        {% endblock %}
    </div>

    <div class="content">
        {% block content %}
        <!-- Page specific content goes here -->
        {% endblock %}
    </div>
</div>

{% block extra_js %}{% endblock %}
</body>
</html>
