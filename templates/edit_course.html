{% extends "admin_home.html" %}

{% block content %}

<div class="container">

    <h2>Edit Course</h2>

    {% if err %}
    <div class="error-message">
        {{ err }}
    </div>
    {% endif %}


    <!-- ===================================================== -->
    <!-- EDIT COURSE -->
    <!-- ===================================================== -->

    <div class="card">

        <h3>Edit Course Details</h3>

        <form
            action="{{ url_for('admin.edit_course', course_id=course.course_id) }}"
            method="POST"
            id="editCourseForm"
            onsubmit="return validateEditCourseForm()"
        >

            <!-- ================================================= -->
            <!-- COURSE NAME -->
            <!-- ================================================= -->

            <div class="form-group">

                <label for="course_name">
                    Course Name
                    <span class="required">*</span>
                </label>

                <input
                    type="text"
                    id="course_name"
                    name="course_name"
                    class="form-control"
                    value="{{ course.course_name }}"
                    placeholder="Enter course name"
                    maxlength="200"
                    required
                >

                <small
                    class="field-error"
                    id="course_name_error"
                ></small>

            </div>


            <!-- ================================================= -->
            <!-- INSTITUTION CATEGORY -->
            <!-- ================================================= -->

            <div class="form-group">

                <label for="institution_category">
                    Institution Category
                    <span class="required">*</span>
                </label>

                <select
                    id="institution_category"
                    name="institution_category"
                    class="form-control"
                    required
                >

                    <option value="">
                        -- Select Institution Category --
                    </option>

                    <option
                        value="School"
                        {% if course.institution_category == "School" %}
                        selected
                        {% endif %}
                    >
                        School
                    </option>

                    <option
                        value="Jr College"
                        {% if course.institution_category == "Jr College" %}
                        selected
                        {% endif %}
                    >
                        Jr College
                    </option>

                    <option
                        value="Degree College"
                        {% if course.institution_category == "Degree College" %}
                        selected
                        {% endif %}
                    >
                        Degree College
                    </option>

                </select>

                <small
                    class="field-error"
                    id="institution_category_error"
                ></small>

            </div>


            <!-- ================================================= -->
            <!-- STATUS -->
            <!-- ================================================= -->

            <div class="form-group">

                <label for="status">
                    Status
                    <span class="required">*</span>
                </label>

                <select
                    id="status"
                    name="status"
                    class="form-control"
                    required
                >

                    <option
                        value="Active"
                        {% if course.status == "Active" %}
                        selected
                        {% endif %}
                    >
                        Active
                    </option>

                    <option
                        value="Inactive"
                        {% if course.status == "Inactive" %}
                        selected
                        {% endif %}
                    >
                        Inactive
                    </option>

                </select>

                <small
                    class="field-error"
                    id="status_error"
                ></small>

            </div>


            <!-- ================================================= -->
            <!-- BUTTONS -->
            <!-- ================================================= -->

            <div class="button-group">

                <button
                    type="submit"
                    class="btn-submit"
                >
                    Update Course
                </button>

                <a
                    href="{{ url_for('admin.course_master') }}"
                    class="btn-cancel"
                >
                    Cancel
                </a>

            </div>

        </form>

    </div>

</div>


<!-- ========================================================= -->
<!-- CSS -->
<!-- ========================================================= -->

<style>

.container {
    max-width: 900px;
    margin: auto;
}

.card {
    background: white;
    padding: 25px;
    border-radius: 6px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.form-group {
    margin-bottom: 15px;
}

.form-group label {
    display: block;
    margin-bottom: 6px;
    font-weight: 600;
}

.form-control {
    width: 100%;
    padding: 9px 10px;
    box-sizing: border-box;
    border: 1px solid #ccc;
    border-radius: 4px;
    font-size: 14px;
    background: white;
}

.required {
    color: #dc3545;
}

.field-error {
    display: block;
    color: #dc3545;
    font-size: 13px;
    margin-top: 4px;
    min-height: 16px;
}


/* ========================================================= */
/* BUTTONS */
/* ========================================================= */

.button-group {
    margin-top: 20px;
    display: flex;
    gap: 10px;
}

.btn-submit {
    background-color: #0d6efd;
    color: white;
    border: none;
    padding: 10px 24px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 15px;
}

.btn-submit:hover {
    opacity: 0.9;
}

.btn-cancel {
    display: inline-block;
    background-color: #6c757d;
    color: white;
    padding: 10px 24px;
    border-radius: 4px;
    text-decoration: none;
    font-size: 15px;
}

.btn-cancel:hover {
    opacity: 0.9;
}


/* ========================================================= */
/* ERROR MESSAGE */
/* ========================================================= */

.error-message {
    color: #721c24;
    background: #f8d7da;
    border: 1px solid #f5c6cb;
    padding: 9px 12px;
    margin-bottom: 12px;
    border-radius: 4px;
}

</style>


<!-- ========================================================= -->
<!-- JAVASCRIPT -->
<!-- ========================================================= -->

<script>

/* ========================================================= */
/* FORM VALIDATION */
/* ========================================================= */

function validateEditCourseForm() {

    let valid = true;


    /* ===================================================== */
    /* CLEAR PREVIOUS ERRORS */
    /* ===================================================== */

    document.getElementById(
        "course_name_error"
    ).textContent = "";

    document.getElementById(
        "institution_category_error"
    ).textContent = "";

    document.getElementById(
        "status_error"
    ).textContent = "";


    /* ===================================================== */
    /* GET VALUES */
    /* ===================================================== */

    const courseName =
        document.getElementById(
            "course_name"
        ).value.trim();

    const category =
        document.getElementById(
            "institution_category"
        ).value;

    const status =
        document.getElementById(
            "status"
        ).value;


    /* ===================================================== */
    /* COURSE NAME VALIDATION */
    /* ===================================================== */

    if (courseName === "") {

        document.getElementById(
            "course_name_error"
        ).textContent =
            "Course name is required.";

        valid = false;

    }
    else if (courseName.length < 2) {

        document.getElementById(
            "course_name_error"
        ).textContent =
            "Course name must contain at least 2 characters.";

        valid = false;

    }


    /* ===================================================== */
    /* CATEGORY VALIDATION */
    /* ===================================================== */

    if (category === "") {

        document.getElementById(
            "institution_category_error"
        ).textContent =
            "Please select an institution category.";

        valid = false;

    }


    /* ===================================================== */
    /* STATUS VALIDATION */
    /* ===================================================== */

    if (status === "") {

        document.getElementById(
            "status_error"
        ).textContent =
            "Please select a status.";

        valid = false;

    }


    return valid;

}

</script>

{% endblock %}
