{% extends "admin_home.html" %}

{% block content %}

<div class="container">

    <h2>Edit Subject</h2>

    {% if err %}
    <div class="error-message">
        {{ err }}
    </div>
    {% endif %}


    <div class="card">

        <h3>Update Subject</h3>

        <form method="POST"
              action="{{ url_for(
                  'admin.edit_subject',
                  subject_master_id=subject.subject_master_id
              ) }}">


            <!-- SUBJECT NAME -->

            <div class="form-group">

                <label for="subject_name">
                    Subject Name
                </label>

                <input
                    type="text"
                    id="subject_name"
                    name="subject_name"
                    value="{{ subject.subject_name }}"
                    required
                >

            </div>


            <!-- COURSE -->

            <div class="form-group">

                <label for="course_id">
                    Course
                </label>

                <select
                    id="course_id"
                    name="course_id"
                    required
                >

                    {% for course in courses %}

                    <option
                        value="{{ course.course_id }}"
                        {% if course.course_id == subject.course_id %}
                        selected
                        {% endif %}
                    >
                        {{ course.course_name }}
                    </option>

                    {% endfor %}

                </select>

            </div>


            <!-- INSTITUTION CATEGORY -->

            <div class="form-group">

                <label for="institution_category">
                    Institution Category
                </label>

                <select
                    id="institution_category"
                    name="institution_category"
                    required
                >

                    <option
                        value="School"
                        {% if subject.institution_category == 'School' %}
                        selected
                        {% endif %}
                    >
                        School
                    </option>

                    <option
                        value="Jr College"
                        {% if subject.institution_category == 'Jr College' %}
                        selected
                        {% endif %}
                    >
                        Jr College
                    </option>

                    <option
                        value="Degree College"
                        {% if subject.institution_category == 'Degree College' %}
                        selected
                        {% endif %}
                    >
                        Degree College
                    </option>

                </select>

            </div>


            <!-- STATUS -->

            <div class="form-group">

                <label for="status">
                    Status
                </label>

                <select
                    id="status"
                    name="status"
                    required
                >

                    <option
                        value="Active"
                        {% if subject.status == 'Active' %}
                        selected
                        {% endif %}
                    >
                        Active
                    </option>

                    <option
                        value="Inactive"
                        {% if subject.status == 'Inactive' %}
                        selected
                        {% endif %}
                    >
                        Inactive
                    </option>

                </select>

            </div>


            <!-- BUTTONS -->

            <div class="action-buttons">

                <button
                    type="submit"
                    class="btn"
                >
                    Update Subject
                </button>

                <a
                    href="{{ url_for('admin.subject_master') }}"
                    class="btn"
                >
                    Cancel
                </a>

            </div>

        </form>

    </div>

</div>


<style>

.action-buttons {
    display: flex;
    align-items: center;
    gap: 10px;
}

</style>

{% endblock %}
